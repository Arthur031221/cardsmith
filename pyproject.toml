[project]
name = "cardsmith"
version = "0.1.0"
description = "Offline flashcard generator. Drop a PDF or slide deck, get a spaced-repetition deck from a local LLM, study it, export to Anki."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.12"
keywords = ["flashcards", "anki", "spaced-repetition", "ollama", "local-llm", "sm-2", "pdf", "quizlet", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pymupdf==1.28.2",
    "python-pptx==1.0.2",
    "genanki==0.13.1",
    "jsonschema==4.26.0",
    "python-multipart==0.0.32",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/cardsmith"
Issues = "https://github.com/Arthur031221/cardsmith/issues"
Changelog = "https://github.com/Arthur031221/cardsmith/blob/main/CHANGELOG.md"

[project.scripts]
cardsmith = "cardsmith.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardsmith"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
]
